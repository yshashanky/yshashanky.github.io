{{- define "main" }}
<main class="blog-list">
  {{- $pages := .Pages.ByDate.Reverse }}

  <ul class="blog-year-list">
  {{- range $pages }}
      <li class="blog-entry">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a><br>
        <span class="blog-meta">{{ .Date.Format "Jan 2006" }}{{ with .Description }} · {{ . }}{{ end }}</span>
      </li>
  {{- end }}
  </ul>
</main>

<style>
.blog-list {
  max-width: 680px;
  margin: 0 auto;
  padding: 0.5rem 1rem 2rem;
}
.blog-year-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.blog-entry {
  margin-bottom: 1.25rem;
}
.blog-entry a {
  font-weight: 500;
  text-decoration: none;
  transition: opacity 0.15s ease;
}
.blog-entry a:hover {
  text-decoration: none;
  opacity: 0.75;
}
.blog-meta {
  font-size: 0.875rem;
  color: var(--secondary);
}
</style>
{{- end }}
