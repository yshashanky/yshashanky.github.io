<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- $url := trim .url " " }}
    {{- $isExternal := or (strings.HasPrefix $url "http") (strings.HasPrefix $url "mailto") (strings.HasSuffix $url ".pdf") }}
    <a href="{{ $url | safeURL }}" {{ if $isExternal }}target="_blank" rel="noopener noreferrer me"{{ end }}
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
</div>
